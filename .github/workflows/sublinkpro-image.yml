name: Build SublinkPro image

# Publishes the application image to GitHub Container Registry:
#   docker pull ghcr.io/<owner>/sublinkpro:latest
#
# Built from the repository Dockerfile (frontend + backend + runtime), so the
# image always matches this fork instead of upstream's zerodeng/sublink-pro.
# The built image is started in demo mode and must answer /api/v1/version
# before anything is pushed.
#
# Upstream keeps its own release pipeline for zerodeng/sublink-pro, so the job
# is limited to forks.

on:
  push:
    branches: ['**']
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'tools/**'
      - '.agents/**'
      - '.claude/**'
      - '.codex/**'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'CONTRIBUTING.md'
      - '.vscode/**'
      - '.idea/**'
      - '.editorconfig'
      - '.gitignore'
      - '.gitattributes'
      - 'LICENSE'
      - 'COPYING'
      - 'docker-compose*.yml'
      - 'docker-compose*.yaml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: sublinkpro-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    if: github.repository_owner != 'ZeroDeng01'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        run: |
          # GHCR requires a lowercase repository name, forks may have uppercase.
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/sublinkpro"
          SHA="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "version=${IMAGE}:sha-${SHA}" >> "$GITHUB_OUTPUT"

      - name: Stamp the version
        # main.go embeds VERSION, so the running instance reports the commit.
        run: echo "${GITHUB_SHA}" | cut -c1-7 > VERSION

      - name: Build image
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          # The Dockerfile builds the frontend and the binary for the target
          # platform, so arm64 would run the whole build under QEMU; add it to
          # --platform when the server needs it.
          docker buildx build \
            --load \
            --platform linux/amd64 \
            --file Dockerfile \
            --tag "${IMAGE}:latest" \
            --tag "${IMAGE}:${GITHUB_REF_NAME//\//-}" \
            --tag "${VERSION}" \
            --cache-from "type=registry,ref=${IMAGE}:buildcache" \
            --cache-to "type=registry,ref=${IMAGE}:buildcache,mode=max" \
            .

      - name: Smoke test the image
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          docker run -d --name sublinkpro-smoke -p 18000:8000 \
            -e SUBLINK_DEMO_MODE=true "${VERSION}"
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:18000/api/v1/version; then
              echo
              echo "server answered"
              exit 0
            fi
            sleep 2
          done
          echo "server did not answer in 60s"
          docker logs sublinkpro-smoke
          exit 1

      - name: Stop the smoke container
        if: always()
        run: docker rm -f sublinkpro-smoke || true

      - name: Push
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
        run: docker push --all-tags "${IMAGE}"
