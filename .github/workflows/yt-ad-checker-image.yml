name: Build yt-ad-checker image

# Publishes the ad checker image to GitHub Container Registry:
#   docker pull ghcr.io/<owner>/yt-ad-checker:latest
#
# Tags: every build gets :<branch> and :sha-<short>; :latest is pushed only
# from the default branch (main).
#
# The image is heavy (~4.8 GB: Playwright + Chromium + mihomo), so it is built
# only when the tool changes and its layers are cached in the registry. The
# unit tests run inside the freshly built image before anything is pushed.
#
# Upstream ships the tool from source and runs its own release pipeline, so the
# job is limited to forks.

on:
  push:
    branches: ['**']
    paths:
      # Only what ends up in the image; README/compose edits do not rebuild it.
      - 'tools/yt-ad-checker/app/**'
      - 'tools/yt-ad-checker/tests/**'
      - 'tools/yt-ad-checker/Dockerfile'
      - 'tools/yt-ad-checker/requirements.txt'
      - 'tools/yt-ad-checker/docker-entrypoint.sh'
      - '.github/workflows/yt-ad-checker-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: yt-ad-checker-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    if: github.repository_owner != 'ZeroDeng01'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Free disk space
        # The Playwright base image plus the build layers do not fit the default
        # runner disk, so drop the preinstalled toolchains we never touch.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # GHCR requires a lowercase repository name, forks may have uppercase.
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/yt-ad-checker"
          SHA="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          TAGS="--tag ${IMAGE}:${GITHUB_REF_NAME//\//-} --tag ${IMAGE}:sha-${SHA}"
          # latest follows the default branch only, so a feature push never
          # changes what production pulls from :latest.
          if [ "${GITHUB_REF}" = "refs/heads/${DEFAULT_BRANCH}" ]; then
            TAGS="--tag ${IMAGE}:latest ${TAGS}"
          fi
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "version=${IMAGE}:sha-${SHA}" >> "$GITHUB_OUTPUT"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build image
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          docker buildx build \
            --load \
            --file tools/yt-ad-checker/Dockerfile \
            ${TAGS} \
            --cache-from "type=registry,ref=${IMAGE}:buildcache" \
            --cache-to "type=registry,ref=${IMAGE}:buildcache,mode=max" \
            tools/yt-ad-checker

      - name: Run the checker unit tests in the built image
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: docker run --rm --entrypoint python "${VERSION}" -m unittest discover -s tests -t .

      - name: Push
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
        run: docker push --all-tags "${IMAGE}"
